<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Important Life Test 💖</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #6a11cb, #2575fc);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  overflow: hidden;
}

.card {
  background: white;
  padding: 30px;
  border-radius: 15px;
  width: 350px;
  text-align: center;
  z-index: 10;
}

button {
  padding: 12px 20px;
  margin: 10px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
}

.yes {
  background: #4CAF50;
  color: white;
}

.no {
  background: #f44336;
  color: white;
  position: absolute;
}

.popup {
  display: none;
  background: black;
  color: red;
  padding: 15px;
  border-radius: 10px;
  margin-top: 20px;
}

/* HEARTS */
.heart {
  position: fixed;
  bottom: -20px;
  animation: floatUp 6s linear forwards;
}

@keyframes floatUp {
  0% {
    transform: translateY(0);
    opacity: 1;
  }
  100% {
    transform: translateY(-110vh);
    opacity: 0;
  }
}
</style>
</head>

<body>

<!-- LOVE SONG -->
<audio id="loveSong">
  <source src="https://files.freemusicarchive.org/storage-freemusicarchive-org/music/no_curator/Scott_Holmes_Music/Love/Scott_Holmes_Music_-_04_-_Our_Big_Adventure.mp3" type="audio/mpeg">
</audio>

<div class="card" id="quiz">
  <h2>Will you be my Valentine? 💘</h2>
  <button class="yes" onclick="yesClicked()">Yes ❤️</button>
  <button class="no" id="noBtn">No 💔</button>

  <div class="popup" id="popup">
    ❌ Invalid choice.<br>
    System detected you are already my Valentine 😌💖
  </div>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const popup = document.getElementById("popup");
const song = document.getElementById("loveSong");

let attempts = 0;

noBtn.addEventListener("mouseover", () => {
  attempts++;

  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 50);

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
  noBtn.style.transform = `scale(${1 - attempts * 0.1})`;

  if (attempts >= 3) {
    popup.style.display = "block";
    setTimeout(yesClicked, 2000);
  }
});

function createHeart() {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "❤️";

  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (20 + Math.random() * 30) + "px";

  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 6000);
}

function yesClicked() {
  song.play();

  document.body.innerHTML = `
    <div class="card">
      <h2>🎉 Yay! You're My Valentine! 🎉</h2>
      <p>You just made my world brighter ❤️</p>
    </div>
  `;

  setInterval(createHeart, 300);
}
</script>

</body>
</html>
